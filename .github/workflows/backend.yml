name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Backend tests (Maven + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      # ubuntu-latest já vem com Docker instalado e em execução, então os
      # testes de integração com Testcontainers (ver
      # AbstractIntegrationTest.java) funcionam sem configuração adicional.
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

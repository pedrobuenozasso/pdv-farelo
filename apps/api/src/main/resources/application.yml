spring:
  application:
    name: farelo-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:farelo}
    username: ${POSTGRES_USER:farelo}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # FARELO-062: `metrics` added so outbox.events.pending / .oldest.age
        # (OutboxMetrics) are reachable at /actuator/metrics — off by
        # default in Spring Boot, only `health` was previously opted in.
        include: health, metrics

# FARELO-061: how long a PROCESSED outbox_event row is kept before
# OutboxRetentionCleaner deletes it. See that class's javadoc for why 7
# days — never applies to PENDING rows, regardless of age.
outbox:
  retention:
    processed-days: 7
  worker:
    # FARELO-063: max PENDING rows OutboxWorker locks (FOR UPDATE SKIP
    # LOCKED) and processes per poll. See OutboxWorker's javadoc.
    batch-size: 100
    # How often OutboxWorker's @Scheduled trigger fires, in ms. See
    # OutboxWorker's javadoc for why this is configurable rather than a
    # literal 5000 in the annotation.
    poll-interval-ms: 5000

# FARELO-121: JWT signing/expiry for POST /api/v1/auth/login. See
# com.farelo.api.security.auth.JwtTokenService's javadoc for the full
# design reasoning (HS256, stateless — no session table, no revocation yet).
# `secret` MUST be overridden via JWT_SECRET outside dev — the default here
# is intentionally insecure, same spirit as spring.datasource.password's
# change-me default above; it's only long enough (32+ bytes) to satisfy
# HS256's minimum key-length check so the app still boots in dev/test
# without a real secret configured.
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-before-any-real-deploy}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

# FARELO-111: Meta WhatsApp Cloud API adapter config — see
# com.farelo.api.notification.whatsapp.WhatsAppCloudApiClient's javadoc for
# what each value does and why phone-number-id/access-token default to
# empty (no live Meta account exists in this dev environment).
whatsapp:
  api:
    base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    connect-timeout-ms: ${WHATSAPP_API_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${WHATSAPP_API_READ_TIMEOUT_MS:10000}

# FARELO-112: how often NotificationWorker's @Scheduled trigger fires, in
# ms — same configurable-rather-than-literal reasoning as
# outbox.worker.poll-interval-ms above. See NotificationWorker's javadoc.
notification:
  worker:
    poll-interval-ms: 5000

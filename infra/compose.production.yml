# Preparação para produção. Não executar contra dados reais antes dos gates em
# infra/README.md. Passe --env-file /etc/farelo/production.env ao Compose.
name: farelo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.production.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    mem_limit: 2500m
    cpus: 1.5
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.production.Dockerfile
      args:
        API_BASE_URL: http://api:8080
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    mem_limit: 1500m
    cpus: 1.0
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FARELO_DOMAIN: ${FARELO_DOMAIN:?required}
      ACME_EMAIL: ${ACME_EMAIL:?required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [app]
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
